# Fork-only: builds a multi-arch image from this branch and pushes it to ghcr.io.
# Not part of the upstream PR. Runs on push to the `ghcr-image` branch.
name: ghcr-image
on:
  push:
    branches: [ghcr-image]

env:
  IMAGE: ghcr.io/klofton-bw/argocd-image-updater
  TAG: v1.1.0

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ env.TAG }}-${{ matrix.arch }}

  manifest:
    name: multi-arch manifest
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push manifest
        run: |
          docker buildx imagetools create -t "$IMAGE:$TAG" \
            "$IMAGE:$TAG-amd64" "$IMAGE:$TAG-arm64"
          docker buildx imagetools inspect "$IMAGE:$TAG"
